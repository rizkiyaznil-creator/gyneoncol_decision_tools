name: Deploy ke GitHub Pages

# Situs statik (tanpa build). Mengunggah isi repo sebagai artefak Pages.
# Catatan: environment "github-pages" hanya mengizinkan deploy dari branch
# default repo. Branch default saat ini = branch kerja di bawah, jadi pemicu
# push diarahkan ke sana agar setiap perubahan otomatis ter-publish.
on:
  push:
    branches: [claude/keen-galileo-Ds0jq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
